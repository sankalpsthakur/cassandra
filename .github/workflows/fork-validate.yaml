# Fork-only validation of one backport. Not part of the patch.
# cassandra-4.1 has no .build/docker scripts, so ant is run directly. 4.1 builds on JDK 8 (default) and JDK 11
# (-Duse.jdk11=true); the checkstyle and checkstyle-test targets only run on JDK 8.
name: Fork validation
on:
    push:
        branches:
            - 'validate/c5236-**'
permissions:
    contents: read
defaults:
    run:
        shell: bash
env:
    # apache/cassandra tip of cassandra-4.1 the patch was cut from
    BASE_SHA: fe284a3af9dc30162bea7cd56abc329a66c86a3c
    # the committer's 4.1 commit, tests untouched
    HIS_SHA: bdee3cc09afbbffb192d8cf5cce15e9c3ecc38c1
jobs:
    # The committer's commit exactly as he pushed it. Its test is expected NOT to compile, so green means "failed to compile
    # as predicted"; the compile errors are printed in the log.
    his-commit-test-compile-expected-to-fail:
        name: his-commit-test-compile-expected-to-fail-jdk${{ matrix.jdk }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                jdk: ['8', '11']
        env:
            ANT_FLAGS: ${{ matrix.jdk == '11' && '-Duse.jdk11=true' || '' }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
            with:
              fetch-depth: 4
          - name: JDK ${{ matrix.jdk }}
            uses: actions/setup-java@v4
            with:
              java-version: ${{ matrix.jdk }}
              distribution: 'temurin'
          - name: Ant
            run: |
              if ! ant -version 2>/dev/null | grep -Eq 'version 1\.(1[0-9]|[2-9][0-9])'; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq ant
              fi
              ant -version
              java -version
          - name: Check out his commit exactly
            run: |
              git log --format='%h %an | %cn | %s' -4
              test "$(git rev-parse HEAD~2)" = "$HIS_SHA"
              git checkout --detach "$HIS_SHA"
              git log -1 --format='now at %h %an | %cn | %s'
          - name: Build main and test classes
            run: |
              set +e
              ant build-test $ANT_FLAGS > build-test.log 2>&1
              echo "ant build-test exit code: $?"
              grep -n -A3 'error:' build-test.log | head -80
              echo "---- judgement"
              grep -q 'TableMetricTablesTest.java:[0-9]*: error: cannot find symbol' build-test.log || { echo "UNEXPECTED: no cannot-find-symbol error in the test"; exit 1; }
              grep -A3 'TableMetricTablesTest.java:[0-9]*: error: cannot find symbol' build-test.log | grep -q 'addVirtualKeyspace' || { echo "UNEXPECTED: addVirtualKeyspace is not among the missing symbols"; exit 1; }
              echo "OK: his test fails to compile on JDK ${{ matrix.jdk }}, as predicted"

    # The patch branch as committed (his commit plus the test-only commit): the new test and the LatencyMetrics tests must pass.
    with-patch:
        name: with-patch-jdk${{ matrix.jdk }}
        runs-on: ubuntu-latest
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                jdk: ['8', '11']
        env:
            ANT_FLAGS: ${{ matrix.jdk == '11' && '-Duse.jdk11=true' || '' }}
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: JDK ${{ matrix.jdk }}
            uses: actions/setup-java@v4
            with:
              java-version: ${{ matrix.jdk }}
              distribution: 'temurin'
          - name: Ant
            run: |
              if ! ant -version 2>/dev/null | grep -Eq 'version 1\.(1[0-9]|[2-9][0-9])'; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq ant
              fi
              ant -version
              java -version
          - name: Commits under test
            run: git log --format='%h %an | %cn | %s' -4
          - name: Build main and test classes (on JDK 8 this runs checkstyle and checkstyle-test)
            run: |
              set -o pipefail
              ant build-test $ANT_FLAGS 2>&1 | tee build-test.log
          - name: Static checks seen in the build
            run: grep -n -i -E '^(checkstyle|checkstyle-test|_build-test|BUILD)|\[checkstyle\]' build-test.log | head -30
          - name: Run the new test and the LatencyMetrics tests
            continue-on-error: true
            run: |
              for t in org.apache.cassandra.db.virtual.TableMetricTablesTest org.apache.cassandra.metrics.LatencyMetricsTest; do
                ant testsome -Dno-build-test=true -Dtest.name=$t $ANT_FLAGS || true
              done
          - name: Check the results
            run: python3 .github/validate/check_junit.py pass TableMetricTablesTest,LatencyMetricsTest
          - name: Checkstyle, checkstyle-test and rat-check
            if: matrix.jdk == '8'
            run: ant checkstyle checkstyle-test rat-check

    # Same tree with only the conversion logic reverted: the new test must fail on its assertions.
    without-patch:
        name: without-patch-jdk8
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: JDK 8
            uses: actions/setup-java@v4
            with:
              java-version: '8'
              distribution: 'temurin'
          - name: Ant
            run: |
              if ! ant -version 2>/dev/null | grep -Eq 'version 1\.(1[0-9]|[2-9][0-9])'; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq ant
              fi
              ant -version
              java -version
          # The new test calls toMsFactor, TIMER_UNIT_TO_MS and latencyTable, so restoring the whole file would not
          # compile. Revert only the multiplier in LatencyTableMetric.add (back to the pre-patch constant 0.000001) and
          # restore LatencyMetrics.java from the base branch; the test hooks stay but no longer influence the output.
          - name: Revert the conversion logic, keep the new test and its hooks
            run: |
              f=src/java/org/apache/cassandra/db/virtual/TableMetricTables.java
              test "$(grep -c 'value \*= TIMER_UNIT_TO_MS;' $f)" = 1
              sed -i 's|value \*= TIMER_UNIT_TO_MS;|value *= 0.000001; // NS_TO_MS, as before the patch|' $f
              git fetch --no-tags --depth=1 https://github.com/apache/cassandra.git "$BASE_SHA"
              git checkout "$BASE_SHA" -- src/java/org/apache/cassandra/metrics/LatencyMetrics.java
              git status --short
              git diff HEAD -U1 -- src
              grep -n 'value \*= ' $f
              grep -n 'createReservoir' src/java/org/apache/cassandra/metrics/LatencyMetrics.java
          - name: Build main and test classes
            run: ant build-test
          - name: Run the new test (its assertions are expected to fail)
            continue-on-error: true
            run: ant testsome -Dno-build-test=true -Dtest.name=org.apache.cassandra.db.virtual.TableMetricTablesTest
          - name: Check that all four new test methods failed on their assertions
            run: python3 .github/validate/check_junit.py fail-before TableMetricTablesTest.testLatencyIsReportedInMilliseconds,TableMetricTablesTest.testSubMillisecondLatencyIsNotRoundedToZero,TableMetricTablesTest.testColumnsWithoutMsSuffixAreNotConverted,TableMetricTablesTest.testLatencyIsReportedInMillisecondsForAnyTimerUnit

    # Regression sweep: every test class in org.apache.cassandra.db.virtual.
    virtual-package:
        name: db-virtual-package-jdk8
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: JDK 8
            uses: actions/setup-java@v4
            with:
              java-version: '8'
              distribution: 'temurin'
          - name: Ant
            run: |
              if ! ant -version 2>/dev/null | grep -Eq 'version 1\.(1[0-9]|[2-9][0-9])'; then
                sudo apt-get update -qq
                sudo apt-get install -y -qq ant
              fi
              ant -version
              java -version
          - name: Build main and test classes
            run: ant build-test
          - name: Run all tests of org.apache.cassandra.db.virtual
            continue-on-error: true
            run: |
              for f in test/unit/org/apache/cassandra/db/virtual/*Test.java; do
                ant testsome -Dno-build-test=true -Dtest.name=org.apache.cassandra.db.virtual.$(basename $f .java) || true
              done
          - name: Check the results
            run: python3 .github/validate/check_junit.py sweep test/unit/org/apache/cassandra/db/virtual
